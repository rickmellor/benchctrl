[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchctrl"
version = "1.0.0"
description = "Open-source Python control stack for your lab bench — drives an Otii Arc/Pro SMU plus companion programmable loads, with an MCP server, battery emulator, and reproducible-scenario harness."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "benchctrl contributors" }
]
keywords = ["smu", "source-measurement-unit", "instrumentation", "usb", "current-measurement", "otii", "arc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]
numpy = [
    "numpy>=1.20",
]
pandas = [
    "benchctrl[numpy]",
    "pandas>=2.0",
]
parquet = [
    "benchctrl[pandas]",
    "pyarrow>=10",
]
plot = [
    "benchctrl[numpy]",
    "matplotlib>=3.5",
]
science = [
    "benchctrl[parquet]",
    "benchctrl[plot]",
]
mcp = [
    "mcp>=1.0",
]
# `bench` instrument drivers (pyserial-only; already a base dep)
bench = []
# Future SCPI / VISA bench instruments (Rigol DL3031A etc.)
bench-visa = [
    "benchctrl[bench]",
    "pyvisa>=1.13",
]

[project.scripts]
benchctrl = "benchctrl.cli:main"
benchctrl-mcp = "benchctrl.mcp:main"

[project.urls]
Documentation = "https://github.com/benchctrl/benchctrl#readme"
Repository = "https://github.com/benchctrl/benchctrl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require a connected Arc Pro device",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# strict mode deferred to v0.2 — see ROADMAP.md
