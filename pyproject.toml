[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensmu"
version = "0.4.1"
description = "Open-source Python control library for USB source-measurement units (Qoitech Otii Arc/Pro). No vendor server required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OpenSMU contributors" }
]
keywords = ["smu", "source-measurement-unit", "instrumentation", "usb", "current-measurement", "otii", "arc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]
numpy = [
    "numpy>=1.20",
]
pandas = [
    "opensmu[numpy]",
    "pandas>=2.0",
]
parquet = [
    "opensmu[pandas]",
    "pyarrow>=10",
]
plot = [
    "opensmu[numpy]",
    "matplotlib>=3.5",
]
science = [
    "opensmu[parquet]",
    "opensmu[plot]",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
opensmu = "opensmu.cli:main"
opensmu-mcp = "opensmu.mcp:main"

[project.urls]
Documentation = "https://github.com/opensmu/opensmu#readme"
Repository = "https://github.com/opensmu/opensmu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require a connected Arc Pro device",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# strict mode deferred to v0.2 — see ROADMAP.md
