name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: pytest (hardware-free) on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Hardware-free tests use mock objects; we install [bench-visa]
          # for the pyvisa Python module but don't install a VISA backend,
          # which the mocks don't need.
          pip install -e ".[dev,mcp,bench-visa,science]"

      - name: Run hardware-free tests
        run: pytest -m "not hardware" -q

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,bench-visa]"

      - name: Ruff
        run: ruff check src tests validation

      - name: Mypy
        run: mypy src
        # mypy isn't yet clean on the whole tree; ROADMAP has the strict-mode plan.
        continue-on-error: true
