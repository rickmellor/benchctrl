# Boot straight into the benchctrl kiosk dashboard — no greeter, no login.
#
# Installed to /etc/lightdm/lightdm.conf.d/90-benchctrl-kiosk.conf. A drop-in
# rather than an edit to lightdm.conf, for one reason: the board has no
# keyboard, so recovery has to be a single deletion over ssh.
#
#     sudo rm /etc/lightdm/lightdm.conf.d/90-benchctrl-kiosk.conf
#     sudo systemctl restart lightdm
#
# ...and the normal xfce greeter is back, untouched. Nothing else on the board
# is modified: lightdm stays enabled (deploy/benchctrl-display-hotplug depends
# on lightdm starting Xorg, and it finds its X authority by parsing that Xorg's
# -auth argv), and xfce stays installed and selectable.
#
# The 90- prefix means this sorts after Debian's shipped 01_debian.conf and
# wins on the keys it sets.

[Seat:*]
# The desktop user. Must be able to read /etc/benchctrl/agent.json
# (group-readable at 0640 root:arduino) for the display's agent token.
autologin-user=arduino

# 0 = log in immediately. There is no keyboard to interrupt a countdown with,
# so a nonzero value would only delay the panel.
autologin-user-timeout=0

# Overrides user-session, so the kiosk runs regardless of what xfce set as the
# user's last session.
autologin-session=benchctrl-kiosk

# False so the session is activated immediately rather than started behind the
# greeter's VT — with no keyboard, a session on another VT is unreachable.
autologin-in-background=false
