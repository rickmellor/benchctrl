# Installed by deploy/install-kiosk.sh to /etc/X11/xorg.conf.d/ on hosts whose
# display is the Raspberry Pi vc4 KMS driver (a Pi 4 or Pi 5).
#
# Those boards expose two DRM devices: v3d (the 3D core, no outputs) and vc4
# (the display pipeline with the HDMI ports). Xorg's autoconfiguration takes
# the first it finds and, when that is v3d, dies with
#
#     (EE) Cannot run in framebuffer mode. Please specify busIDs for all
#          framebuffer devices
#
# and lightdm loops restarting it forever with nothing on the panel. Binding
# the modesetting driver to the vc4 device and marking it primary is the
# documented fix; it is a no-op on a board that has no vc4.
Section "OutputClass"
    Identifier "vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
